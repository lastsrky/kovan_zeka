# ==============================================================================
# KOVAN ZEKA - MERKEZİ YAPILANDIRMA DOSYASI (config.yaml)
# ==============================================================================
# [KODLAMA BİLMEYENLER İÇİN ALTIN SÖZDİZİMİ KURALLARI - LÜTFEN OKUYUN]:
# 1. TAB TUŞU KESİNLİKLE YASAKTIR: Girintilemelerde klavyedeki TAB tuşunu KULLANMAYIN!
#    Sadece boşluk (Space) tuşunu kullanın. Her alt seviye için TAM 2 BOŞLUK kullanın.
# 2. İKİ NOKTA ÜST ÜSTE (:) KURALI: Parametre adından sonra gelen iki noktadan sonra
#    MUTLAKA bir boşluk bırakılmalıdır. Örnek: "dur_s: 3.0" (DOĞRU), "dur_s:3.0" (YANLIŞ).
# 3. ONDALIKLI SAYILARDA NOKTA KURALI: Sayılarda asla virgül (,) KULLANMAYIN!
#    Nokta (.) kullanın. Örnek: "3.5" (DOĞRU), "3,5" (YANLIŞ - PROGRAM ÇÖKER).
# 4. MANTIKSAL DEĞERLER (BOOLEAN): Açık/kapalı ayarları için sadece küçük harfle
#    "true" (açık) veya "false" (kapalı) yazın. Tırnak içine ALMAYIN.
# 5. BÖLÜM BAŞLIKLARI: "camera:", "vision:", "trafik:" gibi ana başlıkların solunda
#    hiç boşluk olmamalıdır; en solda hizalı kalmalıdır.
# ==============================================================================

# ==============================================================================
# 1. camera: Intel RealSense D435/D455 Derinlik Kamerası Donanım Ayarları
# ==============================================================================
camera:
  # [AÇIKLAMA]: Kameranın yatay piksel çözünürlüğü. Görüntü netliğini ve işlem yükünü belirler.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 640). İki noktayı silmeyin.
  width: 640

  # [AÇIKLAMA]: Kameranın dikey piksel çözünürlüğü.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 480). İki noktayı silmeyin.
  height: 480

  # [AÇIKLAMA]: Saniyede yakalanan kare sayısı (FPS). Yüksek hızlarda gecikmeyi düşürür.
  # [NASIL DEĞİŞTİRİLİR]: Sadece tamsayıyı değiştirin (örn: 30 yerine 15 veya 60).
  fps: 30

  # [AÇIKLAMA]: Şerit takibi için orijinal karenin üstten kırpılma oranı (%29.17). Ufuk çizgisini ve tavan ışıklarını eler.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.2917 yerine 0.25 yazın). Noktayı silmeyin, virgül KULLANMAYIN.
  crop_top_ratio: 0.2917

  # [AÇIKLAMA]: Otomatik pozlama kontrolü. true ise ortam ışığına göre kamera parlaklığı kendi dengeler.
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın (tırnak kullanmayın, küçük harfle yazın).
  auto_exposure: true

  # [AÇIKLAMA]: Manuel pozlama süresi (auto_exposure: false olduğunda etkindir, mikrosaniye cinsindendir).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 300 yerine 400 yazın).
  exposure_value: 300

  # [AÇIKLAMA]: Manuel sensör kazancı (auto_exposure: false olduğunda etkindir). Karanlıkta parlaklığı artırır.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 16 yerine 20 yazın).
  gain: 16

  # [AÇIKLAMA]: Derinlik (Depth) sensör akışını açar. false yapılırsa tabela, yaya, park ve sollama mesafeleri ölçülemez!
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın (küçük harfle).
  enable_depth: true

# ==============================================================================
# 2. vision: Görüntü İşleme ve Beyaz/Sarı Şerit Çizgisi Takip Parametreleri
# ==============================================================================
vision:
  # [AÇIKLAMA]: Şerit ayırma eşikleme yöntemi: "binary" (sabit parlaklık eşiği) veya "adaptive" (yerel parlaklık ortalaması).
  # [NASIL DEĞİŞTİRİLİR]: Sadece binary veya adaptive yazın (tırnaksız).
  threshold_mode: binary

  # [AÇIKLAMA]: Adaptif eşiklemede yerel blok piksel boyutu (tek sayı olmak zorundadır).
  # [NASIL DEĞİŞTİRİLİR]: Sadece tek sayı yazın (örn: 51 yerine 41). Çift sayı YAZMAYIN.
  adaptive_block_size: 51

  # [AÇIKLAMA]: Adaptif eşiklemede ortalamadan çıkarılan sabit değer. Negatif değer açık renk çizgileri vurgular.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: -20 yerine -15 yazın). Eksi işaretini unutmayın.
  adaptive_C: -20

  # [AÇIKLAMA]: Sabit gri tonlama eşik değeri (0-255). Bu değerin üzerindeki parlak pikseller şerit kabul edilir.
  # [NASIL DEĞİŞTİRİLİR]: Sadece tamsayıyı değiştirin (örn: 150 yerine 160 yazın).
  binary_thresh: 150

  # [AÇIKLAMA]: Görüntüdeki parazit ve kumlanmayı azaltan Gauss bulanıklaştırma çekirdek boyutu (tek sayı).
  # [NASIL DEĞİŞTİRİLİR]: Sadece tek sayı yazın (örn: 5 yerine 3 veya 7).
  blur_ksize: 5

  # [AÇIKLAMA]: Morfolojik kapanma filtresi genişliği (yatay piksel).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 3).
  morph_kernel_w: 3

  # [AÇIKLAMA]: Morfolojik kapanma filtresi yüksekliği (dikey piksel). Kesik kesik şeritleri dikeyde birleştirir.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 55 yerine 45 yazın).
  morph_kernel_h: 55

  # [AÇIKLAMA]: Morfolojik kapatma filtresi tekrarlama adedi.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 2 yerine 1).
  morph_iterations: 2

  # [AÇIKLAMA]: Şerit arama ilgi alanının (ROI) üst sınırı (oran). Küçük değer daha uzağa bakmayı sağlar.
  # [NASIL DEĞİŞTİRİLİR]: Sadece ondalıklı sayıyı değiştirin (örn: 0.17 yerine 0.20 yazın). Noktayı silmeyin.
  roi_top_ratio: 0.17

  # [AÇIKLAMA]: Şerit arama ilgi alanının (ROI) alt sınırı (oran). Aracın hemen burnunun dibini keser.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.54 yerine 0.60 yazın).
  roi_bottom_ratio: 0.54

  # [AÇIKLAMA]: Tek şerit ayrıştırma modunu açar (bağlı bileşen analiziyle şerit seçimi).
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  select_single_line: true

  # [AÇIKLAMA]: Geçerli bir şerit parçası için minimum piksel alanı. Küçük zemin tozlarını ve lekeleri eler.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 250 yerine 300 yazın).
  min_component_area: 250

  # [AÇIKLAMA]: Şerit takip stratejisi: "lane_center" (iki çizgi ortası), "center", "left" veya "right".
  # [NASIL DEĞİŞTİRİLİR]: Sadece metni değiştirin (örn: lane_center).
  line_select_mode: lane_center

  # [AÇIKLAMA]: Tek şerit görüldüğünde yolun merkezini bulmak için kullanılan yarım şerit genişliği (piksel).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 232 yerine 220 yazın).
  lane_half_width_px: 232

  # [AÇIKLAMA]: Şeride eğri uydurmak (polinom) için gereken minimum beyaz piksel sayısı. Altında kalırsa şerit kayıp sayılır.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 300 yerine 250 yazın).
  min_pixels: 300

  # [AÇIKLAMA]: Şerit eğrisinin polinom derecesi (2 = parabolik eğri, virajları iyi kavrar; 1 = düz doğru).
  # [NASIL DEĞİŞTİRİLİR]: Sadece 1 veya 2 yazın.
  poly_degree: 2

  # [AÇIKLAMA]: Gürültüden dolayı kendi üzerine katlanan hatalı matematiksel eğrileri reddeder.
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  reject_folded_fit: true

  # [AÇIKLAMA]: İleriye bakış hedef noktasının ROI içindeki dikey yükseklik oranı (%55). Artarsa araç daha uzağa göre erken döner.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.55 yerine 0.50 yazın). Noktayı koruyun.
  lookahead_ratio: 0.55

  # [AÇIKLAMA]: Şerit çizgisi anlık kesildiğinde son bilinen şerit pozisyonunun kaç kare boyunca hatırlanacağı (hafıza tamponu).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 12 yerine 10 yazın).
  memory_frames: 12

  # [AÇIKLAMA]: Geçerli şerit bileşeninin ROI dikey yüksekliğine minimum oranı. Yatay zemin çizgilerini eler.
  # [NASIL DEĞİŞTİRİLİR]: Sadece ondalıklı sayıyı değiştirin (örn: 0.35 yerine 0.30 yazın).
  min_line_height_ratio: 0.35

  # [AÇIKLAMA]: Şerit bileşeninin sınır kutusu doluluk oranı. Blok şeklindeki büyük lekeleri eler.
  # [NASIL DEĞİŞTİRİLİR]: Sadece ondalıklı sayıyı değiştirin (örn: 0.8 yerine 0.75 yazın).
  max_component_fill: 0.8

  # [AÇIKLAMA]: İki kare arasında şerit merkezinin yatayda yapabileceği maksimum sıçrama (piksel). Ani parlamaları engeller.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 120 yerine 100 yazın).
  max_line_jump_px: 120

  # [AÇIKLAMA]: Şeridin tüm ROI boyunca uzanması şartı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  require_roi_span: false

  # [AÇIKLAMA]: ROI boyunca uzanma şartındaki kenar tolerans oranı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.12).
  span_tolerance_ratio: 0.12

  # [AÇIKLAMA]: Katlanma kontrolünde izin verilen geri dönüş sınırı (piksel).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 20.0).
  max_fold_backtrack_px: 20.0

  # [AÇIKLAMA]: Tek bir karede sapma (deviation) değerinin en fazla ne kadar değişebileceği (direksiyon ani kırılmasını önler).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.25 yerine 0.20 yazın).
  max_deviation_step: 0.25

  # [AÇIKLAMA]: İki şerit arası mesafe ofsetinin dinamik öğrenilme katsayısı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.2).
  offset_learn_rate: 0.2

  # [AÇIKLAMA]: Satır başına maksimum ortalama genişlik (0 = filtre kapalı).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0).
  max_row_width_px: 0

  # [AÇIKLAMA]: ROI bölgesini dikdörtgen yerine yamuk (perspektif) şeklinde kesme anahtarı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  roi_trapezoid: false

  # [AÇIKLAMA]: Yamuk ROI üst kenar genişlik oranı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.75).
  roi_top_width_ratio: 0.75

  # [AÇIKLAMA]: Yamuk ROI alt kenar genişlik oranı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 1.0).
  roi_bottom_width_ratio: 1.0

  # [AÇIKLAMA]: Yamuk ROI merkez konumu oranı (0.5 = tam orta).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.5).
  roi_center_ratio: 0.5

  # [AÇIKLAMA]: Kameranın aracın fiziksel merkezine göre montaj kaçıklığı (piksel). Düz yolda araç bir tarafa çekiyorsa buradan ayarlanır.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 6.9 yerine 0.0 veya -5.0 yazın).
  image_center_offset_px: 6.9

  # [AÇIKLAMA]: Şerit sapma değeri yumuşatma filtresi katsayısı (Alpha EMA). Küçük değer titremeyi keser, büyük değer daha çevik yapar.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.4 yerine 0.35 yazın).
  deviation_smoothing: 0.4

  # [AÇIKLAMA]: Tek şeritte doğrudan keskin dönüş algılama sapma eşiği.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.6).
  corner_direct_threshold: 0.6

  # [AÇIKLAMA]: Keskin virajın devreye girmesi için gereken ardışık kare sayısı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 3).
  corner_frames: 3

  # [AÇIKLAMA]: Keskin dönüş modunda uygulanacak sabit direksiyon açısı oranı (%90 tam dönüş).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.9 yerine 0.85 yazın).
  horizontal_turn: 0.9

  # [AÇIKLAMA]: Doğrudan keskin viraj modunu açma/kapatma bayrağı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  corner_direct_enable: false

  # [AÇIKLAMA]: Keskin virajdan çıkış için düz yolun görüldüğü kare sayısı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 25).
  corner_exit_frames: 25

  # [AÇIKLAMA]: Keskin viraj modunda en fazla kalınabilecek maksimum kare emniyet tavanı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 150).
  corner_max_hold: 150

  # [AÇIKLAMA]: Eğim tabanlı viraj tespiti tetikleme eşiği.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 1.0).
  corner_slope_threshold: 1.0

  # [AÇIKLAMA]: Eğim tabanlı virajdan çıkış eşiği.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.4).
  corner_exit_slope: 0.4

  # [AÇIKLAMA]: Eğim tabanlı viraj tetiklenme kare sayısı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 3).
  corner_trigger_frames: 3

  # [AÇIKLAMA]: Virajdan çıkışta şeridin merkezden uzaklık toleransı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.15).
  corner_exit_center_frac: 0.15

  # [AÇIKLAMA]: Sabit viraj yönü ("left" = sol, "right" = sağ).
  # [NASIL DEĞİŞTİRİLİR]: Sadece left veya right yazın.
  corner_fixed_direction: left

  # [AÇIKLAMA]: Eğim tabanlı yatay viraj yardımcısını açma/kapama.
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  corner_enable: false

  # [AÇIKLAMA]: Sol şerit kaybolma sayacı eşiği.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 3).
  corner_lm_trigger: 3

  # [AÇIKLAMA]: Sol şerit kaybında viraj tetikleyici minimum eğim.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.5).
  corner_slope_min: 0.5

  # [AÇIKLAMA]: Sol şerit tekrar bulunduğunda çıkış için gereken kare sayısı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 3).
  corner_exit_found: 3

  # [AÇIKLAMA]: Sol şerit kaybı viraj manevrası maksimum süresi (kare sayısı).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 60).
  corner_max_frames: 60

# ==============================================================================
# 3. controller: Direksiyon PID (Oransal-İntegral-Türev) Kontrolcüsü
# ==============================================================================
controller:
  # [AÇIKLAMA]: Oransal Kazanç (Kp): Şerit sapmasıyla anlık orantılı direksiyon tepkisi verir.
  #             Artırılırsa virajları daha sert alır; aşırı artırılırsa araç düz yolda yalpalar (balık kuyruğu).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.9 yerine 0.8 veya 1.1 yazın). Noktayı koruyun.
  kp: 0.9

  # [AÇIKLAMA]: İntegral Kazanç (Ki): Zamanla biriken kalıcı hatayı sıfırlar (genelde direksiyonda 0.0 bırakılır).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.0).
  ki: 0.0

  # [AÇIKLAMA]: Türevsel Kazanç (Kd): Sapmanın değişim hızına direnç göstererek direksiyonu sönümler ve savrulmayı önler.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.1 yerine 0.15 yazın).
  kd: 0.1

  # [AÇIKLAMA]: İntegral birikiminin doygunluk tavanı (windup önleyici).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 1.0).
  integral_limit: 1.0

  # [AÇIKLAMA]: PID kontrolcüsünün üretebileceği maksimum normalize direksiyon çıktısı (-1.0 ile +1.0 arası).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 1.0).
  output_limit: 1.0

# ==============================================================================
# 4. motor: ESP8266 Seri Port, Ön Direksiyon Servosu ve Arka Çekiş Motoru
# ==============================================================================
motor:
  # [AÇIKLAMA]: ESP8266 motor sürücüsünün bağlı olduğu Linux seri port aygıt yolu.
  # [NASIL DEĞİŞTİRİLİR]: Sadece metni değiştirin (örn: /dev/ttyUSB0 yerine /dev/ttyUSB1 yazın).
  port: /dev/ttyUSB0

  # [AÇIKLAMA]: Seri port haberleşme veri hızı (baud rate).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 115200).
  baud: 115200

  # [AÇIKLAMA]: Ön tekerlekleri tam düz konuma getiren servo açısı (derece cinsinden).
  #             Araç düz yolda sağa veya sola çekiyorsa bu sayıyı 1'er 2'şer artırıp azaltarak rot ayarı yapın.
  # [NASIL DEĞİŞTİRİLİR]: Sadece tamsayıyı değiştirin (örn: 110 yerine 112 veya 108 yazın).
  steering_center: 110

  # [AÇIKLAMA]: Direksiyonun merkezden sağa ve sola dönebileceği maksimum açı farkı (örn: 110 ± 35 = 75° ile 145° arası).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 35 yerine 40 yazın).
  steering_max_delta: 35

  # [AÇIKLAMA]: Direksiyon yönünü tersine çevirir. Araç sağa dönmesi gerekirken sola kırıyorsa true yapın.
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  steering_invert: false

  # [AÇIKLAMA]: Gaz komutunun (%100 gaz) motorda karşılık geldiği maksimum donanımsal PWM tavanı. Aracın son hız sınırıdır.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 300 yerine 350 veya 250 yazın).
  throttle_max_pwm: 300

  # [AÇIKLAMA]: Seri porta komut gönderme arasındaki minimum bekleme süresi (milisaniye). Seri hattın kilitlenmesini önler.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 50).
  min_send_interval_ms: 50

  # [AÇIKLAMA]: ESP8266 ile ilk açılışta bağlantı kurulması için maksimum bekleme zaman aşımı (saniye).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 2.0).
  connect_timeout_s: 2.0

# ==============================================================================
# 5. run: Çalıştırma ve Başlangıç Hız Durumları
# ==============================================================================
run:
  # [AÇIKLAMA]: Program ilk açıldığındaki varsayılan gaz oranı (0.0 = araç hareket etmez, Space tuşu bekler).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.0 yerine 0.25 yazın).
  default_throttle: 0.0

  # [AÇIKLAMA]: MQTT üzerinden veya uzaktan start sinyali geldiğinde aracın otomatik ayarlayacağı seyir gazı (%30 gaz = ~90 PWM).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.3 yerine 0.35 yazın). Noktayı koruyun.
  start_throttle: 0.3

  # [AÇIKLAMA]: OpenCV görsel hata ayıklama (debug) pencerelerini ekranda gösterir (true) veya gizler (false).
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  debug: true

# ==============================================================================
# 6. trafik: Trafik Işığı Görevi (Kırmızıda Durma, Yeşil Yanınca Devam Etme)
# ==============================================================================
trafik:
  # [AÇIKLAMA]: Trafik ışığı görevini tamamen açar (true) veya devre dışı bırakır (false).
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın (küçük harfle).
  enable: true

  # [AÇIKLAMA]: Kameranın orijinal görüntüsünün üstten taranacak dikey yüzdesi (%60). Alt %40 kesilerek yerdeki kırmızılıklar elenir.
  # [NASIL DEĞİŞTİRİLİR]: Sadece ondalıklı sayıyı değiştirin (örn: 0.60 yerine 0.50 yazın).
  ust_bant: 0.60

  # [AÇIKLAMA]: Kırmızı ışık HSV Renk Özü (Hue) aralıkları. Kırmızı renk 0 ve 180 etrafında iki parçalıdır.
  # [NASIL DEĞİŞTİRİLİR]: Köşeli parantezleri ve virgülleri silmeyin, sadece parantez içindeki sayıları değiştirin.
  hue_bantlari:
  - [0, 10]
  - [150, 180]

  # [AÇIKLAMA]: Kırmızı ışık için minimum doygunluk (Saturation) eşiği (0-255). Soluk lambaları eler.
  # [NASIL DEĞİŞTİRİLİR]: Sadece tamsayıyı değiştirin (örn: 60 yerine 70 yazın).
  s_min: 60

  # [AÇIKLAMA]: Kırmızı ışık için minimum parlaklık (Value) eşiği (0-255). Sönük lambaları eler.
  # [NASIL DEĞİŞTİRİLİR]: Sadece tamsayıyı değiştirin (örn: 150 yerine 130 veya 170 yazın).
  v_min: 150

  # [AÇIKLAMA]: Kırmızı ışık lekesinin minimum piksel alanı. Uzaktaki küçük parazit ışıkları eler.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 100 yerine 150 yazın).
  area_min: 100

  # [AÇIKLAMA]: Kırmızı ışık lekesinin maksimum piksel alanı. Duvardaki devasa kırmızı posterleri eler.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 3000 yerine 4000 yazın).
  area_max: 3000

  # [AÇIKLAMA]: Lamba sınır kutusu en/boy oran toleransı. Dairesel/kare lambaları kabul eder, uzun şeritleri eler.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 2.0 yerine 1.8 yazın).
  max_aspect: 2.0

  # [AÇIKLAMA]: Kırmızı ışığın dikkate alınacağı maksimum mesafe (cm). 90 cm'den uzaktaki ışıklar yok sayılır.
  #             Hakem "araba ışığa daha yakın durmalı" derse bu sayıyı düşürün (örn: 60.0).
  # [NASIL DEĞİŞTİRİLİR]: Sadece ondalıklı sayıyı değiştirin (örn: 90.0 yerine 70.0 yazın). Noktayı koruyun.
  max_mesafe_cm: 90.0

  # [AÇIKLAMA]: Kameradan derinlik okunamadığında kırmızıyı kabul etme. false ise mesafesi bilinmeyen kırmızıda durmaz.
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  depth_yoksa_kabul: false

  # [AÇIKLAMA]: Aracın durması için kırmızı ışığın üst üste görülmesi gereken kare sayısı (kararlılık filtresi).
  # [NASIL DEĞİŞTİRİLİR]: Sadece tamsayıyı değiştirin (örn: 3 yerine 2 veya 4 yazın).
  dur_frames: 3

  # [AÇIKLAMA]: Kırmızı ışık onaylandıktan sonra durmadan önce normal hızda gitmeye devam edilecek yaklaşma payı (saniye).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.5 yerine 0.2 veya 0.0 yazın).
  gecikme_s: 0.5

  # [AÇIKLAMA]: Araç dururken yeşil ışığın kalkışı tetiklemesi için üst üste görülmesi gereken kare sayısı (~0.83 saniye).
  #             Hakem "yeşil yanınca daha çabuk kalksın" derse bu sayıyı azaltın (örn: 10).
  # [NASIL DEĞİŞTİRİLİR]: Sadece tamsayıyı değiştirin (örn: 25 yerine 15 yazın).
  gec_frames: 25

  # [AÇIKLAMA]: Yeşil ışık HSV Renk Özü (Hue) aralığı.
  # [NASIL DEĞİŞTİRİLİR]: Parantezleri silmeyin, sadece sayıları değiştirin (örn: [35, 90]).
  yesil_bantlari:
  - [35, 90]

  # [AÇIKLAMA]: Yeşil ışık için minimum doygunluk eşiği (0-255).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 60).
  yesil_s_min: 60

  # [AÇIKLAMA]: Yeşil ışık için minimum parlaklık eşiği (0-255).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 120 yerine 100 yazın).
  yesil_v_min: 120

  # [AÇIKLAMA]: Yeşil ışık için minimum piksel alanı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 100).
  yesil_area_min: 100

  # [AÇIKLAMA]: Yeşil ışığın, kilitlenen kırmızı lambanın yatay ekseninden en fazla kaç piksel sapabileceği (aynı direkte arar).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 90 yerine 80 yazın).
  yesil_x_tol_px: 90

  # [AÇIKLAMA]: Durulduğunda kırmızı lambayı takip etmek için kullanılan yarıçap toleransı (piksel).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 80).
  kilit_tol_px: 80

  # [AÇIKLAMA]: Kırmızı ışıkta maksimum bekleme süresi emniyet tavanı (saniye). 0.0 olursa yeşil yanana kadar sonsuza dek bekler!
  #             Hakem "Yeşil yanmasa bile 5 saniye sonra kalk" derse bu değeri 5.0 yapın.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.0 yerine 5.0 yazın). Noktayı silmeyin, virgül KULLANMAYIN.
  max_dur_s: 0.0

  # [AÇIKLAMA]: Trafik ışığı görevinin parkurda tek seferlik çalışmasını sağlar (true = yeşilden sonra bir daha aramaz).
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  once: true

# ==============================================================================
# 7. tabela: Yapay Zeka (TensorRT / YOLO) Tabela Tespiti Genel Ayarları
# ==============================================================================
tabela:
  # [AÇIKLAMA]: Tabela tespit sistemini açar (true) veya kapatır (false). Kapatılırsa yaya ve park tabelaları aranmaz.
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  enable: true

  # [AÇIKLAMA]: Modelin minimum güven (confidence) skoru (%50). Bu değerin altındaki tahminler elenir.
  # [NASIL DEĞİŞTİRİLİR]: Sadece ondalıklı sayıyı değiştirin (örn: 0.5 yerine 0.6 yazın).
  conf_thresh: 0.5

  # [AÇIKLAMA]: Yapay zeka modelinin kaç karede bir çalıştırılacağı (12 = her 12 karede 1 kez model koşturur, GPU'yu rahatlatır).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 12 yerine 6 yazarsanız daha sık kontrol eder).
  period: 12

  # [AÇIKLAMA]: Tabela sınır kutusunun minimum piksel alanı. Çok uzaktaki minik yanlış tespitleri eler.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 400 yerine 300 yazın).
  min_area_px: 400

# ==============================================================================
# 8. yaya: Yaya Geçidi Görevi (Tabela Algılandığında Durma ve Zebra Çizgisini Kör Geçme)
# ==============================================================================
yaya:
  # [AÇIKLAMA]: Yaya geçidi görevini açar (true) veya kapatır (false).
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  enable: true

  # [AÇIKLAMA]: Yaya tabelasına kaç cm mesafe kaldığında durma sürecinin başlayacağı sınır.
  #             Hakem "Tabelaya 70 cm kala durun" derse bu sayıyı 70.0 yapın.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 100.0 yerine 70.0 yazın). Noktayı koruyun.
  dur_mesafe_cm: 100.0

  # [AÇIKLAMA]: Yaya geçidi tabelasının durmayı tetiklemesi için üst üste görülmesi gereken kare sayısı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece tamsayıyı değiştirin (örn: 3 yerine 2 yazın).
  trigger_frames: 3

  # [AÇIKLAMA]: Tabela onaylandıktan sonra durmadan önce normal sürüş yapılacak yaklaşma süresi (saniye).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.0 yerine 1.0 yazın).
  gecikme_s: 0.0

  # [AÇIKLAMA]: Yaya geçidinde sıfır gazla hareketsiz beklenilecek tam süre (saniye).
  #             Hakem "Yaya geçidinde 5 saniye bekleyin" derse bu değeri 5.0 yapın.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 3.0 yerine 5.0 yazın). Noktayı silmeyin.
  dur_s: 3.0

  # [AÇIKLAMA]: Durma bittikten sonra şerit takibi kapatılarak direksiyon tam düz biçimde kör gidilecek süre (saniye).
  #             Zebra çizgilerini aşmak için kullanılır.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 3.0 yerine 4.0 yazın).
  gec_s: 3.0

  # [AÇIKLAMA]: Kör düz geçiş sırasında motora verilecek donanımsal PWM gücü (sabit gaz).
  #             Hakem "Yaya geçidinden daha hızlı geçin" derse bu sayıyı artırın.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 85 yerine 100 yazın).
  gec_pwm: 85

  # [AÇIKLAMA]: Yaya geçidi görevinin parkurda sadece 1 kez yapılmasını sağlar.
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  once: true

# ==============================================================================
# 9. park: Otomatik Park Görevi (Tabela Algılayıp Zemindeki Renkli Alana Yönelme ve Durma)
# ==============================================================================
park:
  # [AÇIKLAMA]: Otomatik park görevini açar (true) veya kapatır (false).
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  enable: true

  # [AÇIKLAMA]: Park tabelasına kaç cm kala park hazırlık moduna (AKTIF) geçileceği mesafe sınırı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 110.0 yerine 90.0 yazın).
  tabela_mesafe_cm: 110.0

  # [AÇIKLAMA]: Park tabelası için minimum piksel alanı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 400).
  tabela_min_area_px: 400

  # [AÇIKLAMA]: Park hazırlığına geçmek için tabelanın üst üste görülmesi gereken kare sayısı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 3).
  trigger_frames: 3

  # [AÇIKLAMA]: Zemindeki renkli alana olan derinlik mesafesi bu değerin altına indiğinde araç tamamen stop eder (cm).
  #             Hakem "Kutuya daha çok yanaşıp dur" derse bu sayıyı düşürün (örn: 10.0).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 25.0 yerine 15.0 yazın).
  dur_mesafe_cm: 25.0

  # [AÇIKLAMA]: Park alanına yaklaşırken ve yönelirken kullanılan düşük seyir PWM gücü (hassas yanaşma hızı).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 80 yerine 65 yazın).
  park_pwm: 80

  # [AÇIKLAMA]: Renkli park alanına yönelme oransal direksiyon kazancı. Artırılırsa renge doğru daha sert döner.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.125 yerine 0.20 yazın).
  park_k: 0.125

  # [AÇIKLAMA]: Renkli zemin lekesi aracın burnunun altına girip kameradan kaybolduğunda, kaç kare sonra parkın bittiği sayılacağı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 5 yerine 8 yazın).
  red_kayip_frames: 5

  # [AÇIKLAMA]: Zemin aramasında görüntünün üstten kırpılma oranı (%25). Duvardaki renkli afişleri eler.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.25).
  ust_kirp: 0.25

  # [AÇIKLAMA]: Zemindeki geçerli hedef renk konturu için minimum piksel alanı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 300).
  red_area_min: 300

  # [AÇIKLAMA]: Robot koldan MQTT mesajı gelmezse aracın yöneleceği acil durum yedek park rengi ("RED", "GREEN" veya "BLUE").
  #             Hakem "Haberleşme yok, yeşile park edin" derse burayı GREEN yapın.
  # [NASIL DEĞİŞTİRİLİR]: Sadece RED, GREEN veya BLUE kelimesini yazın (tırnaksız).
  varsayilan_renk: RED

  # [AÇIKLAMA]: Zemin rengi tespiti için kabul edilen minimum derinlik mesafesi (cm).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 25.0).
  zemin_min_cm: 25.0

  # [AÇIKLAMA]: Zemin rengi tespiti için kabul edilen maksimum derinlik mesafesi (cm).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 350.0).
  zemin_max_cm: 350.0

# ==============================================================================
# 10. colorlink: Robot Kol ile MQTT Kablosuz Ağ Haberleşmesi
# ==============================================================================
colorlink:
  # [AÇIKLAMA]: Robot koldan renk ve başlama sinyali dinleyen MQTT istemcisini açar (true) veya kapatır (false).
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  enable: true

  # [AÇIKLAMA]: Robot kolun veya ana sunucunun MQTT broker IP adresi. Ağ adresi değişirse güncellenmelidir.
  # [NASIL DEĞİŞTİRİLİR]: Sadece IP adresini değiştirin (örn: 10.50.58.31 yerine 192.168.1.50 yazın).
  broker: 10.50.58.31

  # [AÇIKLAMA]: MQTT sunucu port numarası.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (standart: 1883).
  port: 1883

  # [AÇIKLAMA]: Renk bilgisinin dinlendiği birincil MQTT konusu.
  # [NASIL DEĞİŞTİRİLİR]: Sadece metni değiştirin (örn: robot/veri).
  topic: robot/veri

  # [AÇIKLAMA]: Dinlenen ek MQTT konuları (başla ve yükleme mesajları).
  # [NASIL DEĞİŞTİRİLİR]: Tire (-) işaretini ve boşluğu silmeyin, sadece konu metnini değiştirin.
  extra_topics:
  - robot/basla
  - arac/yuk

  # [AÇIKLAMA]: Gelen JSON verisi içinde renk adının aranacağı anahtar kelime.
  # [NASIL DEĞİŞTİRİLİR]: Sadece metni değiştirin (örn: renk).
  field: renk

  # [AÇIKLAMA]: Otonom aracın ağdaki benzersiz MQTT istemci adı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece metni değiştirin (örn: araba-main).
  client_id: araba-main

  # [AÇIKLAMA]: Bağlantıyı canlı tutma (ping/heartbeat) periyodu (saniye).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 60).
  keepalive: 60

  # [AÇIKLAMA]: true olursa robot koldan MQTT mesajı gelmeden klavyeden Space basılsa bile araç kalkış yapamaz!
  #             Masaüstü/tezgah testlerinde aracı elle çalıştırmak için false yapılmalıdır.
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  require_for_start: false

  # [AÇIKLAMA]: true olursa robot koldan renk+basla sinyali geldiği anda araç kimse tuşa basmadan otomatik hareket eder.
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  auto_start: true

  # [AÇIKLAMA]: MQTT sunucusunda önceden kalmış eski hafıza (retained) mesajlarını yok sayar (eski turlardan kalan yanlış rengi engeller).
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  ignore_retained: true

  # [AÇIKLAMA]: Gelen tüm MQTT paketlerini terminale ayrıntılı olarak yazdırır.
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  verbose: true

# ==============================================================================
# 11. overtake: Engelden Kaçma ve Sollama Görevi (Turuncu Kutudan Sağ Şeride Geçiş)
# ==============================================================================
overtake:
  # [AÇIKLAMA]: Sollama görevini açar (true) veya kapatır (false). Kapatılırsa araç turuncu engele çarpar!
  # [NASIL DEĞİŞTİRİLİR]: Sadece true veya false yazın.
  enable: true

  # [AÇIKLAMA]: Turuncu engel kutusu bu mesafenin altına girdiğinde sağ şeride geçiş manevrası başlar (cm).
  #             Hakem "Engele çok yaklaşıyorsun, daha uzaktan solla" derse bu sayıyı artırın (örn: 140.0).
  # [NASIL DEĞİŞTİRİLİR]: Sadece ondalıklı sayıyı değiştirin (örn: 110.0 yerine 130.0 yazın).
  trigger_distance_cm: 110.0

  # [AÇIKLAMA]: Kutu tespiti için kabul edilen maksimum derinlik sınırı (cm).
