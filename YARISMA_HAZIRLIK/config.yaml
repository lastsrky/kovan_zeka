  # [AÇIKLAMA]: Gaz kesme / frenleme adım büyüklüğü (kare başına maksimum gaz düşüşü).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.1 yerine 0.15 yazın).
  throttle_rate_down: 0.1

  # [AÇIKLAMA]: Gaz verme / hızlanma adım büyüklüğü. Ani patinajı önler, aracı yumuşak ivmelendirir.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.02 yerine 0.03 yazın).
  throttle_rate_up: 0.02

  # [AÇIKLAMA]: Motorun sürtünmeyi yenip tekerleği döndürebileceği minimum donanımsal PWM tabanı (aracın bayılmasını önler).
