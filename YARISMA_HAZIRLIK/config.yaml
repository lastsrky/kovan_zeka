  lm_scale_kayip4: 0.75

  # [AÇIKLAMA]: Sol şerit 2 kare boyunca kayıpsa gaz çarpanı (%80 hıza düşer).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.80).
  lm_scale_kayip2: 0.80

  # [AÇIKLAMA]: Sol şeridin bittiği (kesildiği) sezildiğinde gaz çarpanı (%85 hıza düşer).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.85).
  lm_scale_ending: 0.85

  # [AÇIKLAMA]: Viraj eğim ölü bölgesi. Eğim 0.9'dan küçükse yol düz sayılır ve araç yavaşlamaz.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.9).
  slope_deadzone: 0.9

  # [AÇIKLAMA]: Virajda yavaşlama şiddeti katsayısı. Artırılırsa keskin virajlarda gaz daha fazla kesilir.
  # [NASIL DEĞİŞTİRİLİR]: Sadece ondalıklı sayıyı değiştirin (örn: 0.35 yerine 0.40 yazın).
