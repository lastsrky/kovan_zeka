  max_distance_cm: 200.0

  # [AÇIKLAMA]: Sollamanın tetiklenmesi için kutunun üst üste görülmesi gereken kare sayısı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 2).
  trigger_frames: 2

  # [AÇIKLAMA]: Sağ şeride geçmek için hedef şerit merkezine eklenen yatay ofset (piksel, ~2 * şerit yarım genişliği).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 464.0).
  lane_shift_px: 464.0

  # [AÇIKLAMA]: Sağ şeride geçerken her karede uygulanan ofset artış adımı (ani direksiyon kırmayı önleyen yumuşak rampa).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 40.0).
  shift_ramp_px: 40.0

  # [AÇIKLAMA]: Yeni şeride otururken ofsetin kademeli azaltılma adımı.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 60.0).
  release_ramp_px: 60.0

  # [AÇIKLAMA]: Kameranın artık sağ şeridi gördüğünü kanıtlayan piksel atlama eşiği.
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 232.0).
  switch_jump_px: 232.0

  # [AÇIKLAMA]: Şerit değiştirme manevrasının sürmek zorunda olduğu minimum süre (saniye, erken bitmeyi önler).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 0.4).
  min_transition_s: 0.4

  # [AÇIKLAMA]: Şerit değiştirme manevrası için izin verilen maksimum süre (saniye).
  # [NASIL DEĞİŞTİRİLİR]: Sadece sayıyı değiştirin (örn: 2.5).
